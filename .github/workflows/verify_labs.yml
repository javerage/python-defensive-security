name: Verify Labs & Code Health

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-labs:
    name: Verify Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax Compilation Check (py_compile)
        run: |
          python -m py_compile doctor.py
          python -m py_compile src/modulo_01/sesion_01/hola.py
          python -m py_compile src/modulo_01/sesion_01/auditoria_local.py
          python -m py_compile src/modulo_01/sesion_02/starter.py
          python -m py_compile src/modulo_01/sesion_02/solution.py
          python -m py_compile src/modulo_01/sesion_03/starter.py
          python -m py_compile src/modulo_01/sesion_03/solution.py
          python -m py_compile src/modulo_01/sesion_04/starter.py
          python -m py_compile src/modulo_01/sesion_04/solution.py

      - name: Test Environment Creation & Labs Execution (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python doctor.py
          python src/modulo_01/sesion_01/hola.py
          python src/modulo_01/sesion_01/auditoria_local.py
          printf "Alex Mendez\n3\n8.0\n" | python src/modulo_01/sesion_02/solution.py
          python src/modulo_01/sesion_03/starter.py
          python src/modulo_01/sesion_03/solution.py
          python src/modulo_01/sesion_04/starter.py
          python src/modulo_01/sesion_04/solution.py

      - name: Test Environment Creation & Labs Execution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\Activate.ps1
          python doctor.py
          python src/modulo_01/sesion_01/hola.py
          python src/modulo_01/sesion_01/auditoria_local.py
          "Alex Mendez`n3`n8.0" | python src/modulo_01/sesion_02/solution.py
          python src/modulo_01/sesion_03/starter.py
          python src/modulo_01/sesion_03/solution.py
          python src/modulo_01/sesion_04/starter.py
          python src/modulo_01/sesion_04/solution.py
