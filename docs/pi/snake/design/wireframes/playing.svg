<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768"
     font-family="system-ui, sans-serif" role="img"
     aria-label="Wireframe de la pantalla de partida: indicadores de jugador, puntaje, vidas, nivel y velocidad sobre un tablero con serpiente y comida">
  <title>Wireframe · Partida (Playing)</title>
  <desc>Propuesta de diseño en escala de grises, revisada y aprobada. Muestra los indicadores y el tablero central; no define reglas de juego ni estilo visual final.</desc>

  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#bfbfbf"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6b6b6b" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Ventana del navegador de referencia (1024 x 768) -->
  <rect x="1" y="1" width="1022" height="766" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="1" y="1" width="1022" height="40" fill="#ececec" stroke="#2b2b2b" stroke-width="1"/>
  <circle cx="26" cy="21" r="6" fill="#c9c9c9" stroke="#555555" stroke-width="1"/>
  <circle cx="46" cy="21" r="6" fill="#c9c9c9" stroke="#555555" stroke-width="1"/>
