  <!-- Leyenda y notas -->
  <text x="512" y="640" text-anchor="middle" font-size="12.5" fill="#444444">Flechas del teclado (← ↑ → ↓): dirigir la serpiente.</text>
  <text x="512" y="662" text-anchor="middle" font-size="11.5" fill="#666666">Sin pausa, ajustes, reinicio manual ni registro de puntaje desde esta pantalla.</text>

  <text x="512" y="720" text-anchor="middle" font-size="12" fill="#555555">Wireframe en escala de grises · propuesta de diseño revisada y aprobada</text>
  <text x="512" y="740" text-anchor="middle" font-size="12" fill="#555555">Tablero, serpiente, comida, muros y obstáculos con valores ilustrativos; color y tipografía aplazados.</text>
