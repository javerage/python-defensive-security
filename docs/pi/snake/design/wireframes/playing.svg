  <text x="136" y="162" font-size="10" font-weight="700" letter-spacing="1" fill="#666666">JUGADOR</text>
  <text x="136" y="181" font-family="monospace" font-size="11" fill="#111111">player_20261016_120000_000</text>
  <text x="396" y="162" font-size="10" font-weight="700" letter-spacing="1" fill="#666666">PUNTAJE</text>
  <text x="396" y="182" font-size="15" font-weight="700" fill="#111111">0</text>
  <text x="525" y="162" font-size="10" font-weight="700" letter-spacing="1" fill="#666666">VIDAS</text>
  <text x="525" y="182" font-size="15" font-weight="700" fill="#111111">3</text>
  <text x="654" y="162" font-size="10" font-weight="700" letter-spacing="1" fill="#666666">NIVEL</text>
  <text x="654" y="182" font-size="15" font-weight="700" fill="#111111">1</text>
  <text x="783" y="162" font-size="10" font-weight="700" letter-spacing="1" fill="#666666">VELOCIDAD</text>
  <text x="783" y="182" font-size="15" font-weight="700" fill="#111111">1</text>

