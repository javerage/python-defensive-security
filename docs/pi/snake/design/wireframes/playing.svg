  <text x="136" y="109" font-size="16" font-weight="700" fill="#1a1a1a">PARTIDA · Playing</text>
  <text x="888" y="108" text-anchor="end" font-size="12" fill="#666666">propuesta — aprobada</text>

  <!-- Indicadores (HUD) -->
  <rect x="124" y="140" width="776" height="52" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
  <line x1="384" y1="140" x2="384" y2="192" stroke="#cccccc" stroke-width="1"/>
  <line x1="513" y1="140" x2="513" y2="192" stroke="#cccccc" stroke-width="1"/>
