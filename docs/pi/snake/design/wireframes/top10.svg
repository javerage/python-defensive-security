  <desc>Propuesta de diseño en escala de grises, revisada y aprobada. Muestra hasta diez entradas ilustrativas y una única acción «Nueva partida» que vuelve al inicio.</desc>

  <!-- Ventana del navegador de referencia (1024 x 768) -->
